name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Generate APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Ensure Environment and Keystore Files
      run: |
        # 1. Ensure .env exists
        if [ ! -f .env ]; then
          cp .env.example .env 2>/dev/null || touch .env
        fi
        
        # 2. Ensure debug.keystore exists with standard android debug credentials
        if [ ! -f debug.keystore ]; then
          keytool -genkey -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
        fi

    - name: Make Gradlew Executable
      run: chmod +x gradlew

    - name: Build Debug APK
      run: |
        ./gradlew assembleDebug --no-daemon --no-configuration-cache --stacktrace

    - name: Prepare APK Output
      run: |
        mkdir -p output_apk
        find app/build/outputs/apk/debug/ -name "*.apk" -exec cp {} output_apk/RIP-OMR-v1.0.apk \;
        ls -la output_apk/

    - name: Upload APK to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: RIP-OMR-APK
        path: output_apk/*.apk
        retention-days: 30
